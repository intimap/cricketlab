<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cricket Lab</title>
    <style>
      /* One-screen arcade cabinet: the game canvas fills the frame, a slim key strip sits underneath. */
      :root {
        --night: #07140c;
        --strip: #0f2a1c;
        --gold: #e8b931;
        --cream: #f4ecd0;
        --dim: #9fb39b;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color-scheme: dark;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--night);
        color: var(--cream);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #game {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #screen {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
        cursor: pointer;
      }
      .keys {
        flex: none;
        background: var(--strip);
        border-top: 1px solid #2c6b45;
        font: 12px/1.5 var(--mono);
        color: var(--dim);
        padding-block: 6px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
        justify-content: center;
      }
      .keys b {
        color: var(--gold);
        font-weight: 600;
      }
      .touch {
        display: none;
        color: var(--cream);
      }
      @media (pointer: coarse) and (hover: none) {
        .touch {
          display: inline;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div class="keys" aria-label="Controls">
      <span class="touch">Cricket Lab needs a keyboard, so play it on a computer.</span>
      <span><b>Click the game</b>, then <b>Enter</b> to start</span>
      <span><b>Esc</b> menu &amp; instructions</span>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
