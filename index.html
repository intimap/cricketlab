<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Cricket Lab</title>
    <style>
      /* One-screen arcade cabinet: the game canvas fills the frame, a slim key strip sits underneath. */
      :root {
        --night: #07140c;
        --strip: #0f2a1c;
        --gold: #e8b931;
        --cream: #f4ecd0;
        --dim: #9fb39b;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color-scheme: dark;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--night);
        color: var(--cream);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #game {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #screen {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
        cursor: pointer;
      }
      .keys {
        flex: none;
        background: var(--strip);
        border-top: 1px solid #2c6b45;
        font: 12px/1.5 var(--mono);
        color: var(--dim);
        padding-block: 6px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
        justify-content: center;
      }
      .keys b {
        color: var(--gold);
        font-weight: 600;
      }
      /* On a touch screen the on-screen buttons (src/engine/touch.js) take the key strip's place. */
      .touch-device body {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .touch-device .keys {
        display: none;
      }
      /* Sprite test panel (test builds only). */
      #sprite-panel {
        flex: none;
        background: var(--night);
        border-top: 1px solid #2c6b45;
        font: 12px/1.5 var(--mono);
        color: var(--cream);
        padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        align-items: center;
        justify-content: center;
      }
      #sprite-panel ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 2px 16px;
      }
      #sprite-panel .dim,
      #sprite-panel [data-status] {
        color: var(--dim);
      }
      #sprite-panel b {
        color: var(--gold);
        font-weight: 600;
      }
      #sprite-panel button,
      #sprite-panel .file {
        font: inherit;
        color: var(--cream);
        background: var(--strip);
        border: 1px solid #2c6b45;
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
      }
      #sprite-panel .file input {
        display: none;
      }
      #sprite-panel input[type="number"] {
        width: 3.5em;
        font: inherit;
        background: var(--strip);
        color: var(--cream);
        border: 1px solid #2c6b45;
        border-radius: 4px;
      }
    </style>
  </head>
  <body data-start="nets">
    <div id="game"></div>
    <div class="keys" aria-label="Controls">
      <span><b>Click the game</b>, then <b>Enter</b> to start</span>
      <span><b>Esc</b> menu &amp; instructions</span>
    </div>
    <div id="sprite-panel" aria-label="Sprite test">
      <span><b>Sprite test</b> <span data-source></span></span>
      <ul data-slots></ul>
      <label class="file">Load sprite zip<input type="file" accept=".zip,application/zip" data-file /></label>
      <button data-starter>Starter frames</button>
      <button data-on></button>
      <button data-scale></button>
      <button data-copy>Copy settings</button>
      <span data-status></span>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
