<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>BitWicket</title>
    <style>
      /* One-screen arcade cabinet: the game canvas fills the frame, a slim key strip sits underneath. */
      :root {
        --night: #07140c;
        --strip: #0f2a1c;
        --gold: #e8b931;
        --cream: #f4ecd0;
        --dim: #9fb39b;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color-scheme: dark;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--night);
        color: var(--cream);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #game {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #screen {
        position: relative;
        display: block;
        cursor: pointer;
      }
      #screen canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* On a touch screen the on-screen buttons (src/engine/touch.js) are the controls. */
      .touch-device body {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
